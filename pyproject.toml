[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudflare-observability-backup"
version = "0.1.0"
description = "Archive Cloudflare Workers Observability events to SQLite"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
cf-observability-backup = "cf_observability_backup.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["cf_observability_backup"]
